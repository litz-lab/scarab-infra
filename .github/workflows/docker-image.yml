name: Build and Publish Docker Image CI

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
    contents: read
    packages: write

jobs:
  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [allbench_traces, spec2017]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # The tag is a hash of the repository content that actually goes into the
      # image -- the Dockerfiles, fingerprint_src/ and the workload directory,
      # but not the scripts that are bind-mounted at run time. So the tag only
      # changes when the image genuinely differs, and "has this already been
      # built?" is a registry lookup rather than a diff against a recorded
      # last_built_tag. See scripts/image_identity.py.
      - name: Compute image content tag
        id: tag
        run: |
          TAG=$(python3 -m scripts.image_identity ${{ matrix.image }})
          echo "Image content tag for ${{ matrix.image }}: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ref=ghcr.io/litz-lab/scarab-infra/${{ matrix.image }}:$TAG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this exact image was already published
        id: exists
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.ref }}" >/dev/null 2>&1; then
            echo "${{ steps.tag.outputs.ref }} already published; nothing to build."
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        if: steps.exists.outputs.published == 'false'
        run: |
          docker build . \
            --file ./workloads/${{ matrix.image }}/Dockerfile \
            --no-cache \
            --tag "${{ steps.tag.outputs.ref }}"

      - name: Push Docker image to GitHub Packages
        # Manual workflow_dispatch runs build but never publish.
        if: steps.exists.outputs.published == 'false' && github.event_name == 'push'
        run: docker push "${{ steps.tag.outputs.ref }}"
